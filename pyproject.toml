[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-voca-uz"
version = "0.0.1"
description = "Tiny-Voca-UZ-1M: a ~1M-parameter Uzbek text-to-speech model (source-filter synthesis)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.24,<3"]

[project.scripts]
tiny-voca-uz-params = "tiny_voca_uz.params:main"

[tool.setuptools.packages.find]
where = ["src"]
